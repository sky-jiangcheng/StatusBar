name: Release to App Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.14.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    # Same protection as the Developer ID pipeline: the signing cert and the
    # App Store Connect key stay behind required reviewers.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$P12_BASE64" | base64 -D > "$CERT_PATH"
          echo -n "$INSTALLER_P12_BASE64" | base64 -D > "$INSTALLER_CERT_PATH"
          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Import Apple WWDR G3 intermediate so the installer cert chain is complete
          curl -sL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$RUNNER_TEMP/wwdr_g3.cer"
          security import "$RUNNER_TEMP/wwdr_g3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild 2>/dev/null || true
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning 2>&1 | grep -E 'Apple Distribution|3rd Party Mac Developer Application' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          INSTALLER_IDENTITY=$(security find-identity -v -p installer 2>&1 | grep -E '3rd Party Mac Developer Installer' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Fallback: search all identities if installer policy lookup is empty
          if [ -z "$INSTALLER_IDENTITY" ]; then
            INSTALLER_IDENTITY=$(security find-identity -v 2>&1 | grep -E '3rd Party Mac Developer Installer' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "identity=$SIGNING_IDENTITY"
          echo "installer_identity=$INSTALLER_IDENTITY"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          PROFILE_UUID=$(grep -aoE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$PROFILE_PATH" | head -1)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "profile_uuid=$PROFILE_UUID"

      - name: Configure App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Build, sign, and package
        env:
          CHANNEL: mas
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.jiangcheng.MacStatusApp' }}
        run: |
          bash script/release.sh

      - name: Upload to App Store
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # `altool` is deprecated and already missing from some runner images.
          # iTMSTransporter ships with the Xcode selected above and takes the
          # same App Store Connect key; altool stays as a fallback.
          if xcrun --find iTMSTransporter >/dev/null 2>&1; then
            xcrun iTMSTransporter -m upload \
              -assetFile "dist/Topiary.pkg" \
              -apiKey "$API_KEY_ID" -apiIssuer "$API_ISSUER_ID"
          else
            xcrun altool --upload-app --type macos --file "dist/Topiary.pkg" \
              --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          fi

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Topiary-${{ steps.version.outputs.version }}
          path: dist/Topiary.pkg
          if-no-files-found: error
